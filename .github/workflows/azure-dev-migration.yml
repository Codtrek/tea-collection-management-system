

name: Azure Dev Migrations

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-dev-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: migrate-azure-postgres
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash
        working-directory: source-code/backend

    steps:
      # -----------------------------------
      # 1. Checkout and install dependencies
      # -----------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source-code/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # -----------------------------------
      # 2. Validate required secrets
      # -----------------------------------
      - name: Validate required secrets
        env:
          SSH_HOST: ${{ secrets.AZURE_VM_HOST }}
          SSH_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.AZURE_VM_KNOWN_HOSTS }}
          DB_PASSWORD: ${{ secrets.AZURE_DEV_MIGRATION_PASSWORD }}
        run: |
          set -euo pipefail

          failed=0

          for name in SSH_HOST SSH_KEY KNOWN_HOSTS DB_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing or empty secret: $name"
              failed=1
            else
              echo "OK: $name is configured"
            fi
          done

          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi

          echo "All required secrets are configured"

      # -----------------------------------
      # 3. Configure SSH
      # -----------------------------------
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.AZURE_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          install -m 700 -d "$HOME/.ssh"

          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_migrate"
          chmod 600 "$HOME/.ssh/id_migrate"

          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          if ! ssh-keygen -y \
            -f "$HOME/.ssh/id_migrate" \
            > /dev/null 2>&1; then
            echo "::error::Invalid SSH private key"
            exit 1
          fi

          if [[ ! -s "$HOME/.ssh/known_hosts" ]]; then
            echo "::error::Known hosts file is empty"
            exit 1
          fi

          echo "SSH configuration validated"

      # -----------------------------------
      # 4. Verify Azure VM SSH access
      # -----------------------------------
      - name: Verify Azure SSH access
        env:
          SSH_HOST: ${{ secrets.AZURE_VM_HOST }}
        run: |
          set -euo pipefail

          if ! ssh \
            -i "$HOME/.ssh/id_migrate" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -T \
            "harboostuser@$SSH_HOST" \
            'echo "Azure VM SSH authentication succeeded"'; then

            echo "::error::Azure VM SSH verification failed"
            exit 1
          fi

      # -----------------------------------
      # 5. Connect to Azure PostgreSQL
      #    and execute TypeORM migrations
      # -----------------------------------
      - name: Run Azure PostgreSQL migrations
        env:
          SSH_HOST: ${{ secrets.AZURE_VM_HOST }}
          MIGRATION_DB_PASSWORD: ${{ secrets.AZURE_DEV_MIGRATION_PASSWORD }}
        run: |
          set -euo pipefail

          SSH_PID=""

          cleanup() {
            if [[ -n "$SSH_PID" ]]; then
              kill "$SSH_PID" 2>/dev/null || true
              wait "$SSH_PID" 2>/dev/null || true
            fi
          }

          trap cleanup EXIT

          # -----------------------------------
          # 5.1 Open SSH tunnel
          # -----------------------------------
          echo "::group::Opening SSH tunnel"

          ssh -N \
            -i "$HOME/.ssh/id_migrate" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ExitOnForwardFailure=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 \
            -L 127.0.0.1:15433:172.16.0.4:5432 \
            "harboostuser@$SSH_HOST" &

          SSH_PID=$!

          ready=0

          for attempt in {1..10}; do
            if ! kill -0 "$SSH_PID" 2>/dev/null; then
              echo "::error::SSH tunnel process exited"
              exit 1
            fi

            if timeout 2 bash -c \
              'echo > /dev/tcp/127.0.0.1/15433' \
              2>/dev/null; then
              ready=1
              break
            fi

            sleep 1
          done

          if [[ "$ready" -ne 1 ]]; then
            echo "::error::PostgreSQL tunnel did not become ready"
            exit 1
          fi

          echo "PostgreSQL tunnel is reachable"
          echo "::endgroup::"

          # -----------------------------------
          # 5.2 Build migration connection URL
          # -----------------------------------
          echo "::group::Preparing migration connection"

          DATABASE_URL_DIRECT="$(node <<'NODE'
          const url = new URL(
            'postgresql://127.0.0.1:15433/harboost_dev'
          );

          url.username = 'harboost_dev_migrator';
          url.password = process.env.MIGRATION_DB_PASSWORD;

          url.searchParams.set(
            'options',
            '-c role=harboost_dev_owner'
          );

          process.stdout.write(url.toString());
          NODE
          )"

          export DATABASE_URL_DIRECT

          echo "Migration connection prepared"
          echo "::endgroup::"

          # -----------------------------------
          # 5.3 Verify PostgreSQL identity
          # -----------------------------------
          echo "::group::Verifying PostgreSQL identity"

          node <<'NODE'
          const { Client } = require('pg');

          async function main() {
            const client = new Client({
              connectionString: process.env.DATABASE_URL_DIRECT,
              connectionTimeoutMillis: 10000,
              ssl: false,
            });

            try {
              await client.connect();

              const result = await client.query(`
                SELECT
                  session_user,
                  current_user,
                  current_database()
              `);

              const row = result.rows[0];

              if (
                row.session_user !== 'harboost_dev_migrator' ||
                row.current_user !== 'harboost_dev_owner' ||
                row.current_database !== 'harboost_dev'
              ) {
                throw new Error(
                  'Unexpected PostgreSQL database or role'
                );
              }

              console.log('PostgreSQL authentication: OK');
              console.log('Database: harboost_dev');
              console.log('Login role: harboost_dev_migrator');
              console.log('Effective role: harboost_dev_owner');
              console.log('Database identity verified');

            } finally {
              await client.end();
            }
          }

          main().catch(error => {
            console.error(
              `PostgreSQL verification failed (${error.code || 'connection error'})`
            );
            process.exitCode = 1;
          });
          NODE

          echo "::endgroup::"

          # -----------------------------------
          # 5.4 Inspect pending migrations
          # -----------------------------------
          echo "::group::Checking pending TypeORM migrations"

          npx --no-install typeorm-ts-node-commonjs migration:show -d src/data-source.ts

          echo "::endgroup::"

          # -----------------------------------
          # 5.5 Execute migrations
          # -----------------------------------
          echo "::group::Executing TypeORM migrations"

          if npm run migration:run; then
            echo "TypeORM migrations completed successfully"
          else
            echo "::error::TypeORM migration execution failed"
            exit 1
          fi

          echo "::endgroup::"

          # -----------------------------------
          # 5.6 Verify final migration status
          # -----------------------------------
          echo "::group::Final TypeORM migration status"

          npx --no-install typeorm-ts-node-commonjs migration:show -d src/data-source.ts

          echo "::endgroup::"

          echo "Azure Dev database migration job completed"

      # -----------------------------------
      # 6. GitHub Actions summary
      # -----------------------------------
      - name: Success summary
        if: success()
        run: |
          {
            echo "## Azure Dev Migrations"
            echo ""
            echo "**Status:** PASSED"
            echo ""
            echo "- Azure VM SSH authentication succeeded"
            echo "- PostgreSQL tunnel established"
            echo "- Database identity verified"
            echo "- Effective migration role verified"
            echo "- TypeORM migration execution succeeded"
            echo "- Final migration status inspected"
            echo ""
            echo "**Target database:** harboost_dev"
            echo ""
            echo "**Commit:** $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Failure summary
        if: failure()
        run: |
          {
            echo "## Azure Dev Migrations"
            echo ""
            echo "**Status:** FAILED"
            echo ""
            echo "Migration pipeline execution failed."
            echo ""
            echo "Review the failing step for diagnostics."
            echo "Check database migration history before retrying."
          } >> "$GITHUB_STEP_SUMMARY"
