name: Neon PR branch

# Creates a Neon database branch for every PR targeting dev, runs the
# TypeORM migrations on it, and deletes it when the PR is closed or merged.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    branches: [dev]

concurrency:
  group: neon-pr-${{ github.event.number }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEON_BRANCH: ${{ github.event.pull_request.head.ref }}

jobs:
  create-and-migrate:
    # Skip closed PRs and PRs from forks (forks cannot read secrets anyway)
    if: >
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        # Adjust to wherever the NestJS package.json lives
        working-directory: source-code/backend
    steps:
      - uses: actions/checkout@v4

      # Reuses the branch if it already exists (e.g. on a new push)
      - name: Create Neon branch from dev
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          parent_branch: dev
          branch_name: ${{ env.NEON_BRANCH }}
          database: ${{ vars.NEON_DATABASE }}
          role: ${{ vars.NEON_ROLE }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Mask connection strings
        run: |
          echo "::add-mask::${{ steps.neon.outputs.db_url }}"
          echo "::add-mask::${{ steps.neon.outputs.db_url_with_pooler }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source-code/backend/package-lock.json

      - run: npm ci

      # Direct (non-pooled) URL: PgBouncer can break migrations
      - name: Run migrations on the PR branch
        env:
          DATABASE_URL_DIRECT: ${{ steps.neon.outputs.db_url }}
        run: npm run migration:run

      # Fails if entities changed but no migration was committed
      - name: Check for missing migrations
        env:
          DATABASE_URL_DIRECT: ${{ steps.neon.outputs.db_url }}
        run: |
          if npm run migration:generate --name=CiDriftCheck 2>&1 | tee /tmp/gen.log \
             | grep -q "No changes in database schema were found"; then
            echo "Schema matches entities."
          else
            echo "::error::Entities differ from the migrated schema. Run migration:generate and commit the file."
            cat /tmp/gen.log
            exit 1
          fi

      # Optional: uncomment once tests are ready
      # - name: Tests
      #   env:
      #     DATABASE_URL: ${{ steps.neon.outputs.db_url_with_pooler }}
      #   run: npm test

      # The repo is public, so the connection string is encrypted before it
      # is shown. Teammates decrypt it with the shared passphrase.
      - name: Publish encrypted connection string
        env:
          DB_URL: ${{ steps.neon.outputs.db_url }}
          PASS: ${{ secrets.TEAM_PASSPHRASE }}
        run: |
          ENC=$(printf '%s' "$DB_URL" | openssl enc -aes-256-cbc -pbkdf2 -salt -a -A -pass env:PASS)
          {
            echo "### Neon branch \`${NEON_BRANCH}\` is ready"
            echo
            echo "Decrypt the connection string locally:"
            echo
            echo '```bash'
            echo "echo '${ENC}' | openssl enc -d -aes-256-cbc -pbkdf2 -a -A -pass pass:YOUR_PASSPHRASE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  delete-branch:
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ env.NEON_BRANCH }}
          api_key: ${{ secrets.NEON_API_KEY }}