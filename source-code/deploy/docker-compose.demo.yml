services:
  backend-demo:
    build: ../backend
    container_name: tea-cms-backend-demo
    env_file:
      - .env.demo
    environment:
      - NODE_ENV=demo
    networks:
      - tea-cms-net
    restart: unless-stopped

  frontend-demo:
    build:
      context: ../admin
      dockerfile: dockerfile
      args:
        VITE_API_URL: /api
    container_name: tea-cms-frontend-demo
    ports:
      - "8010:80"
    volumes:
      - ./nginx-demo.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-demo
    networks:
      - tea-cms-net
    restart: unless-stopped

volumes:
  postgres_demo_data:

networks:
  tea-cms-net:
    driver: bridge