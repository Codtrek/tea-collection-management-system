# Host nginx — server block for the super admin panel. NOT applied by anything in this repo.
#
# The factory portal and the super admin panel are the SAME build: the React app picks which UI to
# show from window.location.hostname (first label "admin" -> src/admin/AdminApp.tsx). So this block
# only has to hand admin.harboost.duckdns.org to the container that already serves that build and
# proxies /api/ (frontend-demo in docker-compose.demo.yml, published on 127.0.0.1/0.0.0.0:8010).
# The existing harboost.duckdns.org block is left exactly as it is.
#
# Things to change by hand before using it (see the notes at the bottom):
#   1. UPSTREAM_PORT below if the container serving the build is not on 8010
#   2. Issue/extend the TLS certificate to cover the admin hostname
#   3. Create the basic-auth password file

server {
    listen 80;
    server_name admin.harboost.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name admin.harboost.duckdns.org;

    # Same cert lineage as the factory portal once it is expanded to include this name.
    ssl_certificate     /etc/letsencrypt/live/harboost.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/harboost.duckdns.org/privkey.pem;

    # Until real super-admin login exists, keep strangers out at the door.
    # The subdomain only chooses which UI loads — it is NOT access control.
    auth_basic           "Harboost Admin";
    auth_basic_user_file /etc/nginx/.htpasswd-admin;

    # UPSTREAM_PORT: the frontend container (nginx-demo.conf inside it already serves dist/ with the
    # SPA fallback and proxies /api/ to backend-demo:3000), so no root/try_files/api block is needed here.
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Notes -------------------------------------------------------------------------------------
# DNS:  DuckDNS already resolves any sub-subdomain of harboost.duckdns.org to the same IP — no DNS step.
#
# Cert: the existing certificate must also cover admin.harboost.duckdns.org (DuckDNS has no wildcard
#       HTTP-01), e.g.:
#         sudo certbot certonly --nginx --expand -d harboost.duckdns.org -d admin.harboost.duckdns.org
#       If your cert lives under a different name, fix the two ssl_certificate paths above.
#
# Auth: sudo apt install apache2-utils
#       sudo htpasswd -c /etc/nginx/.htpasswd-admin <username>
#
# Rebuild: the admin UI ships in the normal frontend image — redeploy it as usual
#       (./deploy-demo.sh <branch>); nothing extra to build.
#
# Port: 8010 is the demo frontend (deploy-demo.sh prints http://harboost.duckdns.org:8010). If the
#       factory portal at https://harboost.duckdns.org is served from a different container or a
#       static root, point proxy_pass at that same upstream, or replace the proxy block with that
#       block's root/try_files so both hostnames serve the identical dist/.
#
# Apply (when ready): copy into /etc/nginx/sites-available/, symlink into sites-enabled/,
#       sudo nginx -t && sudo systemctl reload nginx
